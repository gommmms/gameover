<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Land Capture</title>
<style>
body{
 margin:0;
 overflow:hidden;
 background:#111;
}
canvas{
 display:block;
}
#ui{
 position:absolute;
 top:10px;
 left:10px;
 color:white;
 font-size:24px;
 font-family:sans-serif;
}
</style>
</head>
<body>

<div id="ui">
점수: <span id="score">0</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const tile=20;

const cols=Math.floor(canvas.width/tile);
const rows=Math.floor(canvas.height/tile);

const map=[];

for(let y=0;y<rows;y++){
 map[y]=[];
 for(let x=0;x<cols;x++){
  map[y][x]=0;
 }
}

const player={
 x:5,
 y:5,
 color:"#3fa9ff"
};

const enemy={
 x:cols-5,
 y:rows-5,
 color:"#ff4444"
};

let score=0;

function draw(){

 ctx.fillStyle="#111";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 for(let y=0;y<rows;y++){
  for(let x=0;x<cols;x++){

   if(map[y][x]){
    ctx.fillStyle="#3fa9ff";
    ctx.fillRect(
      x*tile,
      y*tile,
      tile,
      tile
    );
   }
  }
 }

 ctx.fillStyle=player.color;
 ctx.beginPath();
 ctx.arc(
   player.x*tile+tile/2,
   player.y*tile+tile/2,
   tile/2,
   0,
   Math.PI*2
 );
 ctx.fill();

 ctx.fillStyle=enemy.color;
 ctx.beginPath();
 ctx.arc(
   enemy.x*tile+tile/2,
   enemy.y*tile+tile/2,
   tile/2,
   0,
   Math.PI*2
 );
 ctx.fill();
}

function capture(){

 if(!map[player.y][player.x]){
   map[player.y][player.x]=1;
   score++;
   document.getElementById("score").innerText=score;
 }
}

function moveEnemy(){

 const dx=player.x-enemy.x;
 const dy=player.y-enemy.y;

 if(Math.abs(dx)>Math.abs(dy)){
   enemy.x+=Math.sign(dx);
 }else{
   enemy.y+=Math.sign(dy);
 }

 if(enemy.x===player.x &&
    enemy.y===player.y){
   alert("게임오버");
   location.reload();
 }
}

document.addEventListener("touchstart",(e)=>{

 const touch=e.touches[0];

 const cx=window.innerWidth/2;
 const cy=window.innerHeight/2;

 const dx=touch.clientX-cx;
 const dy=touch.clientY-cy;

 if(Math.abs(dx)>Math.abs(dy)){
   player.x+=Math.sign(dx);
 }else{
   player.y+=Math.sign(dy);
 }

 player.x=Math.max(0,Math.min(cols-1,player.x));
 player.y=Math.max(0,Math.min(rows-1,player.y));

 capture();
});

setInterval(moveEnemy,300);

function loop(){
 draw();
 requestAnimationFrame(loop);
}

capture();
loop();

</script>
</body>
</html>
