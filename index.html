<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>30초 생존</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action: manipulation;
}

body{
    overflow:hidden;
    background:#111;
    font-family:sans-serif;
}

canvas{
    display:block;
    background:#1c1c1c;
}

#ui{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:28px;
    font-weight:bold;
    z-index:10;
}

#message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    text-align:center;
    font-size:42px;
    font-weight:bold;
    display:none;
}
</style>
</head>

<body>

<div id="ui">30</div>
<div id="message"></div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const player = {
    x: canvas.width/2,
    y: canvas.height-150,
    radius: 20,
    speed: 5,
    dir: 1
};

const enemy = {
    x: canvas.width/2,
    y: 100,
    radius: 25,
    speed: 2.4
};

let gameOver = false;
let startTime = Date.now();

const ui = document.getElementById("ui");
const message = document.getElementById("message");

function restartGame(){
    location.reload();
}

document.addEventListener("touchstart", ()=>{
    player.dir *= -1;
});

document.addEventListener("mousedown", ()=>{
    player.dir *= -1;
});

function drawCircle(x,y,r,color){
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
}

function update(){

    if(gameOver) return;

    player.x += player.speed * player.dir;

    if(player.x < player.radius){
        player.x = player.radius;
        player.dir = 1;
    }

    if(player.x > canvas.width-player.radius){
        player.x = canvas.width-player.radius;
        player.dir = -1;
    }

    let dx = player.x - enemy.x;
    let dy = player.y - enemy.y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    enemy.x += (dx/dist) * enemy.speed;
    enemy.y += (dy/dist) * enemy.speed;

    const collisionDist = player.radius + enemy.radius;

    if(dist < collisionDist){
        endGame(false);
    }

    let elapsed = (Date.now() - startTime)/1000;
    let remain = Math.ceil(30 - elapsed);

    ui.textContent = remain;

    if(elapsed >= 30){
        endGame(true);
    }
}

function render(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawCircle(player.x, player.y, player.radius, "#4da6ff");
    drawCircle(enemy.x, enemy.y, enemy.radius, "#ff4444");
}

function endGame(win){

    gameOver = true;

    message.style.display = "block";

    if(win){
        message.innerHTML =
        "🎉 승리!<br><br>30초 생존 성공<br><br>터치하여 재시작";
    }else{
        message.innerHTML =
        "💀 게임 오버<br><br>적에게 잡혔습니다<br><br>터치하여 재시작";
    }

    document.addEventListener("click", restartGame, {once:true});
    document.addEventListener("touchstart", restartGame, {once:true});
}

function loop(){

    update();
    render();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
