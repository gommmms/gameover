<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>30초 생존 + 확장 버전</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
body{overflow:hidden;background:#111;font-family:sans-serif;}
canvas{display:block;background:#181818;}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:18px;
z-index:10;
}

#timer{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:28px;
font-weight:bold;
}

#msg{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:32px;
text-align:center;
display:none;
}
</style>
</head>

<body>

<div id="ui">
❤️ HP: <span id="hp">3</span> |
🪙 Score: <span id="score">0</span> |
🏆 Best: <span id="best">0</span>
</div>

<div id="timer">30</div>
<div id="msg"></div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let startTime=Date.now();
let gameOver=false;

const player={
x:innerWidth/2,
y:innerHeight/2,
r:16,
dx:0,
dy:0,
hp:3,
lastTap:0
};

let score=0;
let best=localStorage.getItem("best")||0;
document.getElementById("best").innerText=best;

const coins=[];
const enemies=[];

// 적 10마리
for(let i=0;i<10;i++){
enemies.push({
x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
r:18
});
}

// 코인 생성
function spawnCoin(){
coins.push({
x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
r:10
});
}
setInterval(spawnCoin,1200);

function setDir(x,y){
const dx=x-player.x;
const dy=y-player.y;
const len=Math.sqrt(dx*dx+dy*dy)||1;
player.dx=dx/len;
player.dy=dy/len;
}

// 터치 + 대시
addEventListener("touchstart",(e)=>{
const now=Date.now();

if(now-player.lastTap<250){
dash();
}
player.lastTap=now;

const t=e.touches[0];
setDir(t.clientX,t.clientY);
});

function dash(){
player.x+=player.dx*80;
player.y+=player.dy*80;
}

addEventListener("mousedown",(e)=>{
setDir(e.clientX,e.clientY);
});

function draw(x,y,r,c){
ctx.beginPath();
ctx.arc(x,y,r,0,Math.PI*2);
ctx.fillStyle=c;
ctx.fill();
}

function update(){

if(gameOver) return;

let t=(Date.now()-startTime)/1000;
let remain=Math.max(0,Math.ceil(30-t));
document.getElementById("timer").innerText=remain;

// 이동
player.x+=player.dx*4;
player.y+=player.dy*4;

// 경계
player.x=Math.max(player.r,Math.min(canvas.width-player.r,player.x));
player.y=Math.max(player.r,Math.min(canvas.height-player.r,player.y));

// 코인
coins.forEach((c,i)=>{
let d=Math.hypot(player.x-c.x,player.y-c.y);
if(d<player.r+c.r){
score++;
coins.splice(i,1);
}
});

// 적
enemies.forEach(e=>{
let dx=player.x-e.x;
let dy=player.y-e.y;
let d=Math.hypot(dx,dy)||1;

e.x+=dx/d*1.8;
e.y+=dy/d*1.8;

if(d<player.r+e.r){
player.hp--;
enemies.splice(enemies.indexOf(e),1);
document.getElementById("hp").innerText=player.hp;

if(player.hp<=0){
end(false);
}
}
});

if(t>=30){
end(true);
}
}

function end(win){
gameOver=true;

if(win){
score+=10;

if(score>best){
best=score;
localStorage.setItem("best",best);
}

document.getElementById("msg").innerHTML=
"🎉 승리!<br>Score: "+score;
}else{
document.getElementById("msg").innerHTML=
"💀 게임오버<br>Score: "+score;
}

document.getElementById("msg").style.display="block";
}

function render(){
ctx.clearRect(0,0,canvas.width,canvas.height);

draw(player.x,player.y,player.r,"#4da6ff");

coins.forEach(c=>draw(c.x,c.y,c.r,"gold"));

enemies.forEach(e=>draw(e.x,e.y,e.r,"red"));
}

function loop(){
update();
render();
requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
