<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>30초 생존 + 코인 + 대시</title>

<link rel="manifest" href="manifest.json">

<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
body{overflow:hidden;background:#111;font-family:sans-serif;}
canvas{display:block;background:#181818;}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:18px;
    z-index:10;
}

#timer{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:28px;
    font-weight:bold;
}

#msg{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:34px;
    text-align:center;
    display:none;
}
</style>
</head>

<body>

<div id="ui">
❤️ HP: <span id="hp">3</span><br>
🪙 SCORE: <span id="score">0</span><br>
🏆 BEST: <span id="best">0</span><br>
⚡ DASH: <span id="dash">READY</span>
</div>

<div id="timer">30</div>
<div id="msg"></div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

// UI
const hpEl = document.getElementById("hp");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const dashEl = document.getElementById("dash");
const timerEl = document.getElementById("timer");
const msgEl = document.getElementById("msg");

let best = localStorage.getItem("best") || 0;
bestEl.innerText = best;

// Player
const player = {
    x: innerWidth/2,
    y: innerHeight/2,
    r: 16,
    dx: 0,
    dy: 0,
    hp: 3
};

let score = 0;

// Coins
const coins = [];
function spawnCoin(){
    coins.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: 8
    });
}
for(let i=0;i<8;i++) spawnCoin();

// Enemies (10 types)
const enemies = [];
function spawnEnemy(){
    const type = Math.floor(Math.random()*10);
    const colors = ["#ff4d4d","#ff7a7a","#ff2e2e","#ff6666","#ff1a1a"];
    enemies.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: 10 + type,
        speed: 0.8 + type*0.2,
        color: colors[type%colors.length]
    });
}
for(let i=0;i<6;i++) spawnEnemy();

// Timer
let start = Date.now();
let over = false;

// Dash
let dashReady = true;
function dash(){
    if(!dashReady || over) return;
    player.x += player.dx * 120;
    player.y += player.dy * 120;
    dashReady = false;
    dashEl.innerText = "COOLDOWN";

    setTimeout(()=>{
        dashReady = true;
        dashEl.innerText = "READY";
    }, 2000);
}

// Input
function setDir(x,y){
    const dx = x - player.x;
    const dy = y - player.y;
    const len = Math.sqrt(dx*dx+dy*dy);
    if(len===0) return;
    player.dx = dx/len;
    player.dy = dy/len;
}

addEventListener("touchstart",e=>{
    const t=e.touches[0];
    setDir(t.clientX,t.clientY);
});

addEventListener("touchmove",e=>{
    const t=e.touches[0];
    setDir(t.clientX,t.clientY);
});

addEventListener("mousedown",e=>{
    setDir(e.clientX,e.clientY);
});

addEventListener("dblclick",dash);
addEventListener("keydown",e=>{
    if(e.code==="Space") dash();
});

// Draw
function circle(x,y,r,c){
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=c;
    ctx.fill();
}

// Game Over
function end(win){
    over=true;
    msgEl.style.display="block";

    if(win){
        msgEl.innerHTML="🎉 클리어!";
    }else{
        msgEl.innerHTML="💀 실패!";
    }

    if(score > best){
        localStorage.setItem("best", score);
    }

    addEventListener("click",()=>location.reload(),{once:true});
}

// Loop
function update(){
    if(over) return;

    const t = (Date.now()-start)/1000;
    const remain = Math.max(0, Math.ceil(30-t));
    timerEl.innerText = remain;

    // move
    player.x += player.dx * 4;
    player.y += player.dy * 4;

    // coins
    for(let i=coins.length-1;i>=0;i--){
        const c = coins[i];
        const d = Math.hypot(player.x-c.x, player.y-c.y);
        if(d < player.r + c.r){
            coins.splice(i,1);
            score += 10;
            scoreEl.innerText = score;
            spawnCoin();
        }
    }

    // enemies
    enemies.forEach(e=>{
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const d = Math.hypot(dx,dy);

        if(d===0) return;

        e.x += dx/d * e.speed;
        e.y += dy/d * e.speed;

        if(d < player.r + e.r){
            player.hp--;
            hpEl.innerText = player.hp;

            player.x += 30;
            player.y += 30;

            if(player.hp<=0) end(false);
        }
    });

    if(t>=30) end(true);
}

function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    circle(player.x,player.y,player.r,"#3da5ff");

    coins.forEach(c=>circle(c.x,c.y,c.r,"gold"));

    enemies.forEach(e=>circle(e.x,e.y,e.r,e.color));
}

function loop(){
    update();
    render();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
